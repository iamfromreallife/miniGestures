name: Verify final performance build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-performance.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run headless regression checks
        shell: cmd
        run: compile.bat --no-pause
      - name: Package compilation source
        shell: pwsh
        run: Compress-Archive -Path src,assets,compile.bat -DestinationPath miniGesturev_2.0.24.zip
      - uses: actions/upload-artifact@v4
        with:
          name: miniGesturev_2.0.24
          path: miniGesturev_2.0.24.zip
